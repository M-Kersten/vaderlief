name: Deploy naar GitHub Pages

# Bouwt de Vite-site en publiceert dist/ naar GitHub Pages.
# Zet in je repo: Settings -> Pages -> "Build and deployment" -> Source:
# "GitHub Actions". Daarna deployt elke push naar de hieronder genoemde
# branches automatisch.

on:
  push:
    branches:
      - main
      - claude/admiring-brahmagupta-38xbe0
  workflow_dispatch:

# Sta toe dat de workflow naar Pages publiceert.
permissions:
  contents: read
  pages: write
  id-token: write

# Eén deploy tegelijk; nieuwere pushes annuleren lopende runs niet halverwege.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Dependencies installeren
        run: npm ci

      - name: Bouwen
        run: npm run build
        env:
          # Discord-webhook uit repository-secrets (zie README). Niet gezet?
          # Dan valt het formulier terug op de mailapp.
          VITE_DISCORD_WEBHOOK_URL: ${{ secrets.VITE_DISCORD_WEBHOOK_URL }}

      - name: Pages configureren
        uses: actions/configure-pages@v5

      - name: Artifact uploaden
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deployen naar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
